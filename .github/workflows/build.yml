name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build self-contained EXE
        shell: pwsh
        run: ./build.ps1
      - name: Strategy self tests
        shell: pwsh
        run: |
          $test = Start-Process -FilePath './release/IdleLegions自动下井.exe' -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw 'Self tests failed' }
          Get-Content "$env:LOCALAPPDATA/FrostAbyss/self-test.json"
      - name: Package release
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: IdleLegions-AutoAbyss-v1.3.6-win-x64
          path: artifacts/*
