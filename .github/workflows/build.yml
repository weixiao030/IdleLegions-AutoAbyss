name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend regression tests
        shell: pwsh
        run: |
          Push-Location ui
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression tests failed' }
          Pop-Location
      - name: Build self-contained EXE
        shell: pwsh
        run: ./build.ps1
      - name: Strategy self tests
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'autoabyss-selftest'
          $testArgs = @('--self-test', '--self-test-dir', ('"{0}"' -f $testDir))
          $test = Start-Process -FilePath './release/IdleLegions自动下井.exe' -ArgumentList $testArgs -Wait -PassThru -WindowStyle Hidden
          $testReport = Join-Path $testDir 'self-test.json'
          if (-not (Test-Path -LiteralPath $testReport)) { throw "Self-test report missing; exit code $($test.ExitCode)" }
          $report = Get-Content -LiteralPath $testReport -Raw | ConvertFrom-Json
          [pscustomobject]@{ ok = $report.ok; checks = @($report.checks).Count; error = $report.error; exitCode = $test.ExitCode } | ConvertTo-Json
          if ($test.ExitCode -ne 0 -or $report.ok -ne $true) { throw 'Self tests failed' }
      - name: Preserve self-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-diagnostics
          path: ${{ runner.temp }}/autoabyss-selftest/
          if-no-files-found: warn
      - name: Preserve failed build for isolated diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-diagnostics
          path: release/IdleLegions自动下井.exe
          if-no-files-found: warn
      - name: Package release
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: IdleLegions-AutoAbyss-v1.3.10-win-x64
          path: artifacts/*
